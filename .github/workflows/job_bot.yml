# =============================================================================
# .github/workflows/job_bot.yml
#
# Runs your job bot every 30 minutes for FREE.
# Public repos = unlimited GitHub Actions minutes.
# API keys stored as encrypted GitHub Secrets — never in code.
# =============================================================================

name: Job Bot — Scrape & Score

on:
  schedule:
    - cron: '0,30 * * * *'   # Every 30 minutes, 24/7
  workflow_dispatch:           # Manual trigger from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Suppress Node.js 20 warnings

jobs:
  run_bot:
    name: Scrape Jobs & Score Matches
    runs-on: ubuntu-latest
    timeout-minutes: 55   # First run scores 300+ jobs — needs up to 40 min.
                          # Subsequent runs are much faster (~10 min).

    steps:
      # ── Step 1: Check out your code ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install Python 3.12 ─────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── Step 3: Install dependencies ────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 4: Write secrets to .env ───────────────────────────
      - name: Create .env from GitHub Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}" >> .env
          echo "NOTIFY_EMAIL=${{ secrets.NOTIFY_EMAIL }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "SCRAPE_LOG_SHEET_ID=${{ secrets.SCRAPE_LOG_SHEET_ID }}" >> .env

      # ── Step 5: Write Google credentials JSON ───────────────────
      - name: Create google_creds.json from secret
        run: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > google_creds.json

      # ── Step 6: Restore seen-jobs database from cache ───────────
      # Keeps memory of every job already scored across all runs.
      - name: Restore seen_jobs database
        uses: actions/cache@v4
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ github.run_number }}
          restore-keys: |
            seen-jobs-db-

      # ── Step 7: Run one scrape + score cycle ─────────────────────
      - name: Run job bot cycle
        run: python run_once.py

      # ── Step 8: Save updated database back to cache ──────────────
      - name: Save seen_jobs database
        uses: actions/cache@v4
        if: always()
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ github.run_number }}
